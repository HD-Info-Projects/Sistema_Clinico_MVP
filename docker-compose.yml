x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: ${APP_ENV:-production}
      FLASK_APP: run.py
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_COLOR: ${LOG_COLOR:-false}
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no .env}
      JWT_ACCESS_TOKEN_EXPIRES_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRES_SECONDS:-43200}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      LOGIN_RATE_LIMIT_IP: "${LOGIN_RATE_LIMIT_IP:-10 per minute}"
      LOGIN_RATE_LIMIT_EMAIL: "${LOGIN_RATE_LIMIT_EMAIL:-5 per minute}"
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_ACCOUNT_LOCK_ENABLED: ${LOGIN_ACCOUNT_LOCK_ENABLED:-true}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-true}
      SECURITY_HSTS_MAX_AGE: ${SECURITY_HSTS_MAX_AGE:-31536000}
      ENABLE_TTS: ${ENABLE_TTS:-false}
      TTS_RATE_LIMIT: "${TTS_RATE_LIMIT:-30 per minute}"
      LGPD_RETENTION_LOGS_INTEGRACAO_DAYS: ${LGPD_RETENTION_LOGS_INTEGRACAO_DAYS:-180}
      LGPD_RETENTION_FILA_SINCRONIZACAO_DAYS: ${LGPD_RETENTION_FILA_SINCRONIZACAO_DAYS:-90}
      LGPD_RETENTION_AUDITORIA_DAYS: ${LGPD_RETENTION_AUDITORIA_DAYS:-1825}
      LGPD_RETENTION_SPDATA_ESPELHO_DAYS: ${LGPD_RETENTION_SPDATA_ESPELHO_DAYS:-730}
      LGPD_RETENTION_BATCH_SIZE: ${LGPD_RETENTION_BATCH_SIZE:-500}
      FIREBIRD_HOST: ${FIREBIRD_HOST}
      FIREBIRD_PORT: ${FIREBIRD_PORT:-3050}
      FIREBIRD_DATABASE: ${FIREBIRD_DATABASE}
      FIREBIRD_USER: ${FIREBIRD_USER}
      FIREBIRD_PASSWORD: ${FIREBIRD_PASSWORD}
      FIREBIRD_CHARSET: ${FIREBIRD_CHARSET:-WIN1252}
      SQLSERVER_HOST: ${SQLSERVER_HOST}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-master}
      SQLSERVER_USER: ${SQLSERVER_USER}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
      SQLSERVER_DRIVER: "${SQLSERVER_DRIVER:-ODBC Driver 18 for SQL Server}"
      SQLSERVER_ENCRYPT: ${SQLSERVER_ENCRYPT:-yes}
      SQLSERVER_TRUST_CERTIFICATE: ${SQLSERVER_TRUST_CERTIFICATE:-yes}
      SQLSERVER_TIMEOUT: ${SQLSERVER_TIMEOUT:-10}
      URL_EXAMES_PACS: ${URL_EXAMES_PACS:?Defina URL_EXAMES_PACS no .env}
      TOKEN_EXAMES_PACS: ${TOKEN_EXAMES_PACS:?Defina TOKEN_EXAMES_PACS no .env}
      PACS_TEM_IMAGEM_CACHE_TTL_SECONDS: ${PACS_TEM_IMAGEM_CACHE_TTL_SECONDS:-21600}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_FLASK_BASE_URL: http://backend:5000
      NUXT_ENABLE_MOCK_AUTH: ${NUXT_ENABLE_MOCK_AUTH:-false}
      NUXT_ENABLE_TTS: ${ENABLE_TTS:-false}
      NUXT_AUTH_COOKIE_SECURE: ${NUXT_AUTH_COOKIE_SECURE:-true}
      NUXT_PUBLIC_AUTH_COOKIE_MAX_AGE_SECONDS: ${NUXT_PUBLIC_AUTH_COOKIE_MAX_AGE_SECONDS:-43200}
      PACS_VIEWER_ALLOWED_HOSTS: ${PACS_VIEWER_ALLOWED_HOSTS:-}
      NUXT_PACS_VIEWER_ALLOWED_HOSTS: ${NUXT_PACS_VIEWER_ALLOWED_HOSTS:-${PACS_VIEWER_ALLOWED_HOSTS:-}}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
